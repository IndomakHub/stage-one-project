name:  Deploy to Ubuntu Server

on:
  push:
    branches: [ "main" ]  # Trigger when you push to main branch

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up SSH access
      - name: Create PEM key
        run: |
          echo "${{ secrets.AWS_PEM_KEY }}" > aws-key.pem
          chmod 600 aws-key.pem
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Step 3: Copy deployment script to server
      - name: Upload deploy.sh to server
        run: |
          scp -o StrictHostKeyChecking=no -i aws-key.pem deploy.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/deploy.sh
          ssh -i aws-key.pem ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "chmod +x ~/deploy.sh"

      # Step 4: Run deployment remotely
      - name: Run deployment
        run: |
          ssh -o StrictHostKeyChecking=no -i aws-key.pem ubuntu@3.90.103.160 "bash ~/deploy.sh"
